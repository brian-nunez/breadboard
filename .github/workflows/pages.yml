name: Pages

# Publishes the docs, starters and landing page of the web UI to
# https://breadboard.b8z.me/ on every push to main. The pages are rendered by
# the same handlers as bb serve (make site), so the site matches the binary.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/configure-pages@v6

      - name: Build
        run: make site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
