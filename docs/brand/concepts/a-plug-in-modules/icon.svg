<path d="M158 397Q158 357 202 350L770 306Q826 302 845 350L894 699Q903 753 850 766L276 855Q222 863 211 811Z" fill="#192821"/>
<path d="M153 366Q149 326 199 322L767 280Q820 276 833 322L887 664Q896 714 846 724L270 813Q219 821 210 773Z" fill="url(#board)" stroke="#687365" stroke-width="3"/>
