<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
<defs>
<linearGradient id="tile" x2="1" y2="1"><stop stop-color="#faf0da"/><stop offset="1" stop-color="#c8b99b"/></linearGradient>
<linearGradient id="board" x2="0.8" y2="1"><stop stop-color="#414c45"/><stop offset="1" stop-color="#202e29"/></linearGradient>
<linearGradient id="red" x2="0.8" y2="1"><stop stop-color="#f39a76"/><stop offset="1" stop-color="#ae4d39"/></linearGradient>
<linearGradient id="sage" x2="1" y2="1"><stop stop-color="#c0d5ac"/><stop offset="1" stop-color="#6c9379"/></linearGradient>
<linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe39a"/><stop offset="1" stop-color="#dea13d"/></linearGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#25271c" flood-opacity=".3"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
<pattern id="holes" width="42" height="42" patternUnits="userSpaceOnUse"><circle cx="21" cy="21" r="6" fill="#111e19"/><path d="M16 24a6 6 0 0 0 10 0" stroke="#718074" stroke-opacity=".45" stroke-width="2"/></pattern>
</defs>
<rect x="24" y="24" width="976" height="976" rx="222" fill="url(#tile)"/>
<rect x="25" y="25" width="974" height="974" rx="221" stroke="#fff9e9" stroke-width="3"/>
<ellipse cx="529" cy="799" rx="321" ry="66" fill="#574f3b" opacity=".2" filter="url(#soft)"/>
<!-- A rounded graphite breadboard, with its front edge visible. -->
