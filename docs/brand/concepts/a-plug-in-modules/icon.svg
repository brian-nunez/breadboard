<path d="M242 747L837 661" stroke="#a3ae92" stroke-opacity=".3" stroke-width="3"/>
</g>
<!-- Copper contacts under the modules. -->
<g stroke="#c9af74" stroke-width="12" stroke-linecap="round"><path d="M291 494v49m48-42v49m48-42v49M612 442v47m47-44v47m47-44v47M534 671v42m46-47v42m46-47v42"/></g>
